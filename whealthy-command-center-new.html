<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WHEALTHY , The Record and The Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#080809;--border:rgba(255,255,255,0.07);--border-mid:rgba(255,255,255,0.12);
  --glass:rgba(255,255,255,0.04);
  --lime:#ccff00;--lime-dim:rgba(204,255,0,0.15);--lime-soft:rgba(204,255,0,0.08);
  --text:#f0f1f3;--text-muted:rgba(240,241,243,0.60);--text-dim:rgba(240,241,243,0.38);
  --font-display:'Oswald',sans-serif;--font-body:'DM Sans',sans-serif;
  --transition:0.3s cubic-bezier(0.23,1,0.32,1);
  --green:#00e676;--green-soft:rgba(0,230,118,0.12);
  --amber:#ffb300;--amber-soft:rgba(255,179,0,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--black);color:var(--text);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100svh;padding-bottom:env(safe-area-inset-bottom)}
body.nav-lock{overflow:hidden}
button{font-family:var(--font-body);cursor:pointer;border:none;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(0.97)}
button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
textarea,input,select{font-size:16px}

.bg-orb{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(204,255,0,0.06)0%,transparent 70%);top:-120px;right:-80px}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.015)1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015)1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 20%,transparent 100%)}

/* Shell */
.dash-container{display:flex;min-height:100svh;position:relative;background:#07080a}
.dash-sidebar{width:260px;background:#0b0c0e;border-right:1px solid rgba(255,255,255,0.04);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:110;padding:24px 16px;transition:transform .3s cubic-bezier(0.16,1,0.3,1)}
.sidebar-brand{padding:8px 12px;margin-bottom:24px}
.sidebar-brand-title{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff}
.sidebar-brand-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px}
.sidebar-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:transparent;border-radius:8px;color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;text-align:left;transition:all .2s}
.sidebar-item:hover{background:rgba(255,255,255,0.03);color:#fff}
.sidebar-item.active{background:#1f2023;color:#fff}
.sidebar-item.active .si-dot{background:var(--lime);box-shadow:0 0 8px rgba(204,255,0,0.5)}
.si-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.2);flex-shrink:0}
.si-day{margin-left:auto;font-family:var(--font-display);font-size:10px;font-weight:700;color:var(--lime);background:rgba(204,255,0,0.1);border:1px solid rgba(204,255,0,0.25);padding:2px 8px;border-radius:99px}
.sidebar-user{margin-top:auto;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:10px 12px}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--lime-dim),var(--lime-soft));border:1px solid rgba(204,255,0,0.2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--lime);flex-shrink:0}
.sidebar-close{display:none;position:absolute;top:16px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);font-size:18px;align-items:center;justify-content:center}
.dash-content{flex:1;margin-left:260px;min-width:0}
.content-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;border-bottom:1px solid rgba(255,255,255,0.04);position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);min-height:72px}
.header-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:100px;padding:6px 14px;font-size:11px;color:#fff;font-weight:500;min-width:0}
.header-pill span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-pill-tag{background:rgba(204,255,0,0.15);color:var(--lime);font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.content-body{padding:clamp(16px,4vw,32px);max-width:1000px;width:100%;margin:0 auto}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:64px;background:rgba(11,12,14,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);padding:0 16px;padding-top:env(safe-area-inset-top);align-items:center;justify-content:space-between;z-index:99}
.mobile-logo{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.mobile-logo span{color:var(--lime)}
.burger{background:transparent;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.burger-lines{display:flex;flex-direction:column;gap:5px;width:22px}
.burger-lines i{display:block;height:2px;border-radius:2px;background:#fff}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:95;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.view-head{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.view-icon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid rgba(204,255,0,0.15);background:rgba(204,255,0,0.03);color:var(--lime);font-family:var(--font-display);font-weight:700;font-size:18px;flex-shrink:0}
.view-title{font-family:var(--font-display);font-size:clamp(19px,4vw,24px);font-weight:700;color:#fff;line-height:1.2}
.view-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px}

/* Cards & shared */
.g-card{background:linear-gradient(135deg,rgba(18,19,22,0.82)0%,rgba(10,11,12,0.92)100%);backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);border:1px solid rgba(255,255,255,0.06);border-top:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:clamp(18px,3vw,28px);box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.04);position:relative;overflow:hidden;margin-bottom:22px}
.g-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.g-eyebrow::before{content:'';width:5px;height:5px;background:var(--lime);border-radius:50%}
.g-title{font-family:var(--font-display);font-size:clamp(17px,3.4vw,21px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin-bottom:10px}
.g-body{font-size:14px;color:var(--text-muted);line-height:1.65}
.g-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn-lime{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(204,255,0,0.12);color:var(--lime);border:1px solid rgba(204,255,0,0.25);border-top:1px solid rgba(204,255,0,0.45);border-radius:14px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;box-shadow:0 4px 20px rgba(204,255,0,0.10);transition:var(--transition)}
.btn-lime:hover{background:rgba(204,255,0,0.2);transform:translateY(-1px)}
.btn-lime:disabled{opacity:.4;pointer-events:none}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:14px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;transition:var(--transition)}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .5s cubic-bezier(0.23,1,0.32,1)}
.demo-note{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:14px}
.demo-toggle{background:none;border:none;color:var(--text-dim);font-size:11px;text-decoration:underline;text-underline-offset:3px;padding:4px 6px;min-height:0}
.demo-toggle:hover{color:var(--text-muted)}

/* Skeletons, never spinners */
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel{background:linear-gradient(90deg,rgba(255,255,255,0.035),rgba(255,255,255,0.09),rgba(255,255,255,0.035));background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:8px;height:13px;margin:9px 0}
.skel.title{height:20px;width:55%}
.skel-note{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}

/* Record: mic with live waveform */
.office-line{font-family:var(--font-display);font-size:clamp(13px,2.6vw,15px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);text-align:center;margin:18px 0 22px}
.office-line b{color:rgba(240,241,243,0.7);font-weight:600}
.recorder{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:20px}
.mic-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.mic-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(204,255,0,0.25);opacity:0;transform:scale(1);pointer-events:none;transition:opacity .3s}
.mic-wrap.rec .mic-ring{opacity:1}
.mic-btn{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(204,255,0,0.14),rgba(204,255,0,0.04));border:2px solid rgba(204,255,0,0.35);color:var(--lime);display:flex;align-items:center;justify-content:center;transition:border-color .3s,box-shadow .3s;position:relative;z-index:2}
.mic-btn svg{width:34px;height:34px}
.mic-btn:hover{border-color:var(--lime);box-shadow:0 0 30px rgba(204,255,0,0.2)}
.mic-wrap.rec .mic-btn{border-color:var(--lime);box-shadow:0 0 calc(18px + var(--amp,0)*46px) rgba(204,255,0,calc(0.22 + var(--amp,0)*0.4))}
.mic-state{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.transcript{width:100%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:14px;color:var(--text);padding:14px 16px;font-family:var(--font-body);line-height:1.7;outline:none;resize:vertical;min-height:110px;margin-bottom:14px;display:none}
.transcript:focus{border-color:rgba(204,255,0,0.4)}
.transcript.show{display:block}
.draft-chip{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);padding:5px 12px;border-radius:99px;margin-bottom:12px}
.saved-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:var(--green-soft);border:1px solid rgba(0,230,118,0.25);border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
.saved-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.their-words{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:16px 18px;font-size:14px;color:var(--text-muted);line-height:1.75;font-style:italic;margin-bottom:14px}
.thread-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:6px 14px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--text-muted)}
.tchip.heavy{border-color:rgba(255,179,0,0.3);color:var(--amber)}
.tchip.win{border-color:rgba(204,255,0,0.3);color:var(--lime)}
.scribe-line{font-size:13.5px;color:var(--text);line-height:1.7;padding:14px 18px;background:rgba(204,255,0,0.04);border:1px solid rgba(204,255,0,0.12);border-left:3px solid var(--lime);border-radius:14px;margin-bottom:8px}
.signal-row{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-left:4px}
.sig{background:none;border:none;min-height:0;padding:4px;display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.sig i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.2);display:inline-block}
.sig.on{color:var(--lime)}
.sig.on i{background:var(--lime);box-shadow:0 0 8px rgba(204,255,0,0.5)}
.resurface{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px 20px;margin-top:4px;animation:fadeUp .6s .2s cubic-bezier(0.23,1,0.32,1) both}
.resurface h5{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px}
.resurface blockquote{font-size:14.5px;color:var(--text);line-height:1.75;font-style:italic;border:none;margin-bottom:8px}
.resurface .why{font-size:12px;color:var(--text-dim)}

/* Threads + Wall */
.thread-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.thread-row:last-of-type{border-bottom:none}
.thread-count{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--lime);min-width:38px;text-align:center;line-height:1.1}
.thread-count small{display:block;font-size:8px;letter-spacing:.1em;color:var(--text-dim);font-family:var(--font-body);font-weight:700;text-transform:uppercase}
.thread-name{font-size:14px;font-weight:700;color:#fff}
.thread-line{font-size:13px;color:var(--text-muted);line-height:1.6;margin-top:2px}
.map-observation{font-size:13.5px;color:var(--text);line-height:1.7;padding:14px 18px;background:rgba(255,255,255,0.025);border-radius:14px;margin-top:14px;border:1px solid rgba(255,255,255,0.06)}
.wall{position:relative;padding-left:26px;margin-top:6px}
.wall::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:rgba(255,255,255,0.08)}
.wnode{position:relative;padding:10px 0 10px 8px;cursor:pointer}
.wnode::before{content:'';position:absolute;left:-24px;top:16px;width:13px;height:13px;border-radius:50%;background:#0f1012;border:2px solid rgba(255,255,255,0.2)}
.wnode.heavy::before{border-color:rgba(255,179,0,0.55)}
.wnode.win::before{border-color:var(--lime);box-shadow:0 0 8px rgba(204,255,0,0.3)}
.wnode-date{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.wnode-date .fd{color:var(--lime);margin-left:8px}
.wnode-peek{font-size:12.5px;color:var(--text-muted);line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wnode-full{display:none;padding:10px 0 4px}
.wnode.open .wnode-full{display:block;animation:fadeUp .3s}
.wnode.open .wnode-peek{display:none}
.wnode-full p{font-size:13.5px;color:var(--text);font-style:italic;line-height:1.7;margin-bottom:8px}
.burn{background:none;border:none;min-height:0;color:var(--text-dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.burn:hover{color:var(--amber)}

/* Fast builder */
.threshold{text-align:center;padding:clamp(30px,8vw,70px) 10px}
.threshold h2{font-family:var(--font-display);font-size:clamp(26px,6vw,44px);font-weight:700;text-transform:uppercase;color:#fff;line-height:1.05;letter-spacing:.02em;max-width:640px;margin:0 auto 16px}
.threshold h2 em{font-style:normal;color:var(--lime)}
.threshold p{font-size:14px;color:var(--text-muted);max-width:420px;margin:0 auto 28px;line-height:1.7}
.gate-card{max-width:560px;margin:0 auto;text-align:left}
.gate-card h3{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:#fff;margin-bottom:16px}
.gate-card p{font-size:14px;color:var(--text-muted);line-height:1.75;margin-bottom:12px;padding-left:16px;border-left:2px solid rgba(255,255,255,0.12)}
.step-progress{display:flex;gap:6px;margin-bottom:20px}
.step-progress i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.08)}
.step-progress i.on{background:var(--lime);box-shadow:0 0 8px rgba(204,255,0,0.4)}
.q-title{font-family:var(--font-display);font-size:clamp(18px,4vw,24px);font-weight:700;text-transform:uppercase;color:#fff;margin-bottom:6px}
.q-sub{font-size:13px;color:var(--text-dim);margin-bottom:20px;line-height:1.6}
.grp-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin:16px 0 8px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--text-muted);font-size:13px;font-weight:600;padding:11px 18px;border-radius:100px;transition:all .2s}
.pill.sel{background:rgba(204,255,0,0.12);border-color:var(--lime);color:var(--lime)}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tile{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px 14px;text-align:left;color:var(--text-muted);font-size:13.5px;font-weight:600;line-height:1.45;transition:all .25s cubic-bezier(0.34,1.56,0.64,1);position:relative}
.tile:hover{background:rgba(255,255,255,0.06);color:#fff}
.tile.sel{background:rgba(204,255,0,0.08);border-color:var(--lime);color:#fff;box-shadow:0 0 16px rgba(204,255,0,0.1)}
.tile small{display:block;font-weight:400;font-size:11px;color:var(--text-dim);margin-top:4px}
.free-input{width:100%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text);padding:12px 14px;font-family:var(--font-body);outline:none;margin-top:12px}
.free-input:focus{border-color:rgba(204,255,0,0.4)}
.guard-card{background:var(--amber-soft);border:1px solid rgba(255,179,0,0.3);border-left:3px solid var(--amber);border-radius:14px;padding:14px 18px;margin-top:14px;font-size:13px;color:var(--text-muted);line-height:1.65;animation:fadeUp .3s}
.guard-card b{color:var(--amber)}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.anchor-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap}
.anchor-row:last-of-type{border-bottom:none}
.anchor-name{font-size:14px;font-weight:600;color:#fff;flex:1;min-width:170px}
.anchor-name small{display:block;font-weight:400;font-size:11px;color:var(--text-dim);line-height:1.5}
.anchor-ctl{display:flex;align-items:center;gap:8px}
.anchor-ctl input{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);padding:9px 10px;font-family:var(--font-body);outline:none;width:110px;min-height:44px}
.stepper{display:flex;align-items:center;border:1px solid rgba(255,255,255,0.1);border-radius:10px;overflow:hidden}
.stepper button{width:44px;height:44px;background:rgba(255,255,255,0.04);color:#fff;font-size:16px;min-height:44px}
.stepper span{min-width:64px;text-align:center;font-family:var(--font-display);font-weight:700;color:var(--lime);font-size:14px}
.grace{font-size:12.5px;color:var(--text-muted);line-height:1.65;padding:14px 18px;background:rgba(204,255,0,0.03);border:1px solid rgba(204,255,0,0.1);border-radius:12px;margin-top:18px;font-style:italic}
.reason-line{font-size:12px;color:var(--text-dim);line-height:1.6;margin-top:10px;padding:10px 14px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid rgba(255,255,255,0.05)}
.reason-line b{color:var(--text-muted)}

/* Forge */
.forge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;text-align:center;gap:26px}
.forge-orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(204,255,0,0.15),transparent 70%);display:flex;align-items:center;justify-content:center;animation:orbPulse 2s ease-in-out infinite}
.forge-orb::after{content:'';width:18px;height:18px;border-radius:50%;background:var(--lime);box-shadow:0 0 30px var(--lime)}
@keyframes orbPulse{0%,100%{box-shadow:0 0 20px rgba(204,255,0,0.2)}50%{box-shadow:0 0 46px rgba(204,255,0,0.45)}}
.forge-line{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);min-height:22px;transition:opacity .5s}

/* Plan: cascading reveal */
.plan-name{font-family:var(--font-display);font-size:clamp(28px,7vw,52px);font-weight:700;text-transform:uppercase;color:#fff;line-height:1;text-align:center;margin-bottom:6px}
.plan-name em{font-style:normal;color:var(--lime)}
.plan-dates{text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:16px}
.casc{opacity:0;animation:fadeUp .55s cubic-bezier(0.23,1,0.32,1) forwards}
.casc-0{animation-delay:.1s}.casc-1{animation-delay:.85s}.casc-2{animation-delay:1.15s}.casc-3{animation-delay:1.45s}.casc-4{animation-delay:1.75s}.casc-5{animation-delay:2.05s}.casc-6{animation-delay:2.35s}.casc-7{animation-delay:2.6s}
.plan-sec-title{font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.plan-sec-title::before{content:'';width:5px;height:5px;background:var(--lime);border-radius:50%}
.rule-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;color:var(--text-muted);line-height:1.6}
.rule-item:last-child{border-bottom:none}
.rule-num{font-family:var(--font-display);font-weight:700;color:var(--lime);min-width:24px}
.sched-row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13.5px}
.sched-row:last-child{border-bottom:none}
.sched-time{font-family:var(--font-display);font-weight:700;color:var(--lime);min-width:74px;font-size:13px}
.sched-act{color:var(--text-muted);line-height:1.55}
.phase-block{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.phase-block h4{font-family:var(--font-display);font-size:15px;font-weight:700;text-transform:uppercase;color:#fff}
.phase-block .ph-days{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
.phase-block p{font-size:13px;color:var(--text-muted);line-height:1.6}
.pray-row{display:flex;flex-wrap:wrap;gap:8px 14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.04);align-items:baseline}
.pray-row:last-child{border-bottom:none}
.pray-week{font-family:var(--font-display);font-weight:700;color:#fff;font-size:13px;min-width:118px}
.pray-week small{display:block;font-family:var(--font-body);font-weight:600;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.ref-btn{background:rgba(204,255,0,0.06);border:1px solid rgba(204,255,0,0.2);color:var(--lime);font-size:12px;font-weight:600;padding:7px 13px;border-radius:100px;min-height:0;transition:var(--transition)}
.ref-btn:hover{background:rgba(204,255,0,0.14)}
.equip-card{border:1px dashed rgba(204,255,0,0.3) !important}
.plan-footer{font-size:10.5px;color:var(--text-dim);line-height:1.7;text-align:center;padding:16px 10px 4px;border-top:1px solid rgba(255,255,255,0.05);margin-top:8px}
.verse-panel{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px 18px;margin-top:12px;font-size:14px;line-height:1.85;color:var(--text);max-height:300px;overflow-y:auto;display:none}
.verse-panel.show{display:block;animation:fadeUp .3s}
.verse-panel .vref{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.speak-btn{background:rgba(204,255,0,0.08);border:1px solid rgba(204,255,0,0.2);color:var(--lime);border-radius:99px;font-size:11px;padding:6px 14px;min-height:0}

/* Daily */
.day-hero{text-align:center;padding:14px 0 8px}
.day-hero .dnum{font-family:var(--font-display);font-size:clamp(60px,16vw,104px);font-weight:700;color:#fff;line-height:.95;text-shadow:0 0 60px rgba(204,255,0,0.12)}
.day-hero .dof{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-top:4px}
.day-hero .dphase{display:inline-flex;margin-top:12px;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);background:rgba(204,255,0,0.08);border:1px solid rgba(204,255,0,0.25);padding:5px 16px;border-radius:100px}
.day-strip{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.dchip{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:9px;font-weight:700;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:var(--text-dim)}
.dchip.filed{background:rgba(204,255,0,0.12);border-color:rgba(204,255,0,0.4);color:var(--lime)}
.dchip.today{outline:1.5px solid var(--lime);outline-offset:1.5px}
.day-focus{font-size:15px;color:var(--text);text-align:center;max-width:440px;margin:18px auto 6px;line-height:1.7}
.day-focus.adapted{color:var(--lime)}
.brief-card{background:rgba(204,255,0,0.03);border:1px solid rgba(204,255,0,0.15);border-radius:16px;padding:18px 20px;margin-bottom:18px;animation:fadeUp .5s}
.brief-card h5{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:8px}
.brief-card p{font-size:13.5px;color:var(--text);line-height:1.7}
.check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .25s}
.check-row:hover{background:rgba(255,255,255,0.04)}
.check-row.kept{background:rgba(204,255,0,0.05);border-color:rgba(204,255,0,0.3)}
.check-row span{font-size:13.5px;font-weight:600;color:var(--text-muted)}
.check-row.kept span{color:var(--lime)}
.check-box{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex-shrink:0}
.check-row.kept .check-box{background:var(--lime);border-color:var(--lime);color:#000}
@keyframes keepBounce{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
.check-row.bounce{animation:keepBounce .3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes breathe{0%{box-shadow:0 8px 32px rgba(0,0,0,0.45)}40%{box-shadow:0 8px 48px rgba(204,255,0,0.22)}100%{box-shadow:0 8px 32px rgba(0,0,0,0.45)}}
.g-card.breathe{animation:breathe 1.6s ease-in-out}
.ceremony{position:fixed;inset:0;z-index:1000;background:rgba(8,8,9,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .4s}
.ceremony.open{opacity:1;pointer-events:auto}
.ceremony h2{font-family:var(--font-display);font-size:clamp(26px,7vw,40px);font-weight:700;color:var(--lime);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 40px rgba(204,255,0,0.4);margin-bottom:10px}
.ceremony p{font-size:15px;color:rgba(255,255,255,0.65);max-width:400px;line-height:1.7}
.demo-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 0 24px}
.covenant-box{font-size:12px;color:var(--text-dim);line-height:1.75}
.covenant-box b{color:var(--text-muted)}

/* ===== Command Center layer ===== */
.side-divider{height:1px;background:rgba(255,255,255,0.06);margin:10px 12px}
.logout-btn{margin-top:12px;width:100%;background:var(--lime);color:#0a0a0a;border:none;border-radius:14px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:14px;box-shadow:0 4px 24px rgba(204,255,0,0.25)}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qa-btn{display:flex;align-items:center;gap:12px;background:rgba(204,255,0,0.03);border:1px solid rgba(204,255,0,0.15);border-radius:16px;padding:16px 14px;color:#fff;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:left;transition:var(--transition)}
.qa-btn:hover{background:rgba(204,255,0,0.08);border-color:rgba(204,255,0,0.35);transform:translateY(-1px)}
