/* --- BAKND/SIMVOLY ISOLATION RESET --- */
#whealthy-quiz-embed h1, #whealthy-quiz-embed h2, #whealthy-quiz-embed h3,

/* ------------------------------------- */

:root{--black:#080809;--charcoal:#0f1012;--graphite:#161719;--graphite-light:#1e2024;--surface:#222428;--surface-2:#2a2d33;--border:rgba(255,255,255,0.07);--border-mid:rgba(255,255,255,0.12);--border-hi:rgba(255,255,255,0.2);--glass:rgba(255,255,255,0.04);--glass-mid:rgba(255,255,255,0.07);--glass-hi:rgba(255,255,255,0.10);--lime:#ccff00;--lime-dim:rgba(204,255,0,0.15);--lime-glow:rgba(204,255,0,0.35);--lime-soft:rgba(204,255,0,0.08);--white:#fff;--white-80:rgba(255,255,255,0.80);--white-60:rgba(255,255,255,0.60);--white-40:rgba(255,255,255,0.40);--white-20:rgba(255,255,255,0.20);--text:#f0f1f3;--text-muted:rgba(240,241,243,0.60);--text-dim:rgba(240,241,243,0.38);--font-display:'Oswald',sans-serif;--font-body:'DM Sans',sans-serif;--radius-sm:8px;--radius:14px;--radius-lg:22px;--radius-xl:32px;--transition:0.3s cubic-bezier(0.23,1,0.32,1);--transition-fast:0.18s cubic-bezier(0.23,1,0.32,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--font-body);background:var(--black);color:var(--text);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100svh}
a,button,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-body);cursor:pointer;border:none}
img{display:block;max-width:100%}
h1,h2,h3,p{overflow-wrap:break-word;word-wrap:break-word}
@media(max-width:640px){input,select,textarea{font-size:16px !important}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--black)}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px}

/* ===================== PAGE LAYOUT ===================== */
.quiz-page{min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.quiz-page__bg{position:fixed;inset:0;z-index:0}
.quiz-page__orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.quiz-page__orb--1{width:600px;height:600px;background:radial-gradient(circle,rgba(204,255,0,0.06)0%,transparent 70%);top:-100px;right:-100px;animation:float-orb 8s ease-in-out infinite}
.quiz-page__orb--2{width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,0.03)0%,transparent 70%);bottom:100px;left:-80px;animation:float-orb 12s ease-in-out infinite reverse}
.quiz-page__orb--3{width:300px;height:300px;background:radial-gradient(circle,rgba(204,255,0,0.04)0%,transparent 70%);top:50%;left:40%;animation:float-orb 10s ease-in-out infinite 3s}
@keyframes float-orb{0%,100%{transform:translateY(0) translateX(0)}33%{transform:translateY(-30px) translateX(15px)}66%{transform:translateY(20px) translateX(-10px)}}
.quiz-page__noise{position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");opacity:.4;pointer-events:none}
.quiz-page__grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02)1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);pointer-events:none}

/* ===================== HEADER ===================== */
.quiz-header{position:relative;z-index:10;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}
.quiz-header__logo{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--text);text-decoration:none}
.quiz-header__logo span{color:var(--lime)}
.quiz-header__badge{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);background:var(--lime-soft);border:1px solid rgba(204,255,0,0.2);padding:4px 10px;border-radius:100px}

/* ===================== QUIZ CONTAINER ===================== */
.quiz-container{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 40px}
.quiz-card{width:560px;max-width:100%;background:rgba(22,23,25,0.75);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--border-mid);border-radius:var(--radius-xl);overflow:hidden;animation:card-enter .6s cubic-bezier(0.23,1,0.32,1)}
@keyframes card-enter{0%{opacity:0;transform:translateY(30px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.quiz-card--result{width:100%;max-width:100%;border-radius:0;border:none;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto}

/* Progress bar */
.quiz-progress{height:3px;background:var(--glass-hi)}
.quiz-progress__fill{height:100%;background:var(--lime);width:0;transition:width .6s cubic-bezier(0.23,1,0.32,1)}

/* Quiz body */
.quiz-body{padding:44px 40px 36px;position:relative;overflow:hidden;min-height:380px}
.quiz-slide{width:100%;opacity:0;transform:translateX(40px);transition:opacity .45s cubic-bezier(0.23,1,0.32,1),transform .45s cubic-bezier(0.23,1,0.32,1)}
.quiz-slide.active{opacity:1;transform:translateX(0)}
.quiz-slide.exiting{opacity:0;transform:translateX(-30px);position:absolute;top:0;left:0;right:0;padding:44px 40px 36px;pointer-events:none}
.quiz-q-num{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:16px}
.quiz-question{font-family:var(--font-display);font-size:26px;font-weight:700;text-transform:uppercase;color:var(--text);margin-bottom:28px;line-height:1.15}
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.qm-option{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--transition);font-size:15px;color:var(--text-muted)}
.qm-option:hover{border-color:var(--border-hi);color:var(--text);background:var(--glass-mid)}
.qm-option.selected{border-color:rgba(204,255,0,0.4);background:var(--lime-soft);color:var(--text)}
.qm-option__radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.qm-option.selected .qm-option__radio{border-color:var(--lime);background:var(--lime)}
.qm-option.selected .qm-option__radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--black)}
.quiz-slide .qm-option{opacity:0;transform:translateY(8px);animation:optionReveal .4s cubic-bezier(0.23,1,0.32,1) forwards}
.quiz-slide .qm-option:nth-child(1){animation-delay:.08s}
.quiz-slide .qm-option:nth-child(2){animation-delay:.14s}
.quiz-slide .qm-option:nth-child(3){animation-delay:.20s}
.quiz-slide .qm-option:nth-child(4){animation-delay:.26s}
@keyframes optionReveal{to{opacity:1;transform:translateY(0)}}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:var(--black);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:16px 32px;border-radius:var(--radius);border:none;cursor:pointer;position:relative;overflow:hidden;transition:var(--transition);box-shadow:0 0 30px rgba(204,255,0,0.3),0 4px 20px rgba(0,0,0,0.4)}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2)0%,transparent 60%);opacity:0;transition:opacity var(--transition-fast)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(204,255,0,0.5),0 8px 30px rgba(0,0,0,0.4)}
.btn-primary:hover::before{opacity:1}
.btn-primary:active{transform:translateY(0)}
.btn-primary--arc{animation:arc-pulse 3s linear infinite}
@keyframes arc-pulse{0%{box-shadow:0 0 30px rgba(204,255,0,0.3),0 4px 20px rgba(0,0,0,0.4)}50%{box-shadow:0 0 60px rgba(204,255,0,0.6),0 4px 20px rgba(0,0,0,0.4)}100%{box-shadow:0 0 30px rgba(204,255,0,0.3),0 4px 20px rgba(0,0,0,0.4)}}
.quiz-next{width:100%;justify-content:center;opacity:.35;pointer-events:none;transition:opacity .3s ease,transform var(--transition),box-shadow var(--transition)}
.quiz-next.ready{opacity:1;pointer-events:auto}

/* Footer */
.quiz-footer{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px}
.quiz-footer__text{font-size:11px;color:var(--text-dim);letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--white-60);background:var(--glass);border:1px solid var(--border);padding:5px 12px;border-radius:100px}
.chip__dot{width:4px;height:4px;background:var(--lime);border-radius:50%}

/* Secondary question */
.secondary-q{text-align:center;padding:20px 0}
.secondary-q__label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:16px}
.secondary-q__question{font-family:var(--font-display);font-size:clamp(18px,3.5vw,24px);font-weight:700;text-transform:uppercase;color:var(--text);margin-bottom:24px;line-height:1.15}

function formatPhone(el){
  var v=el.value.replace(/\D/g,'');
  if(v.length>10)v=v.slice(0,10);
  if(v.length>=7){el.value=v.slice(0,3)+'-'+v.slice(3,6)+'-'+v.slice(6)}
  else if(v.length>=4){el.value=v.slice(0,3)+'-'+v.slice(3)}
  else{el.value=v}
}
function validateEmail(email){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)}
